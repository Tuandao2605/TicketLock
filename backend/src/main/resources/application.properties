spring.application.name=ticketlock
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.data.redis.repositories.enabled=false

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Chỉ dùng update cho bài thực hành; dùng migration khi triển khai thực tế.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Thời gian không hoạt động, không phải thời hạn tuyệt đối từ lúc login.
spring.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:ticketlock_redis_dev}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# Spring Boot 4 dùng tiền tố spring.session.data.redis.
spring.session.data.redis.repository-type=indexed
spring.session.data.redis.namespace=ticketlock:session
server.servlet.session.cookie.name=JSESSIONID
