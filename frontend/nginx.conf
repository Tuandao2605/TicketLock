# Giữ nguyên X-Forwarded-Proto từ proxy phía trước (vd: https từ Cloudflare Tunnel); nếu không có thì fallback về $scheme (http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    # Lắng nghe cổng 80 trong container cho mọi domain trỏ tới.
    listen 80;
    server_name _;
    # Ẩn phiên bản Nginx trong header Server và trang lỗi để tránh lộ thông tin CVE.
    server_tokens off;
    # Thư mục chứa file tĩnh React sau khi build.
    root /usr/share/nginx/html;
    index index.html;

    # Lưu ý: Nếu thêm add_header vào bất kỳ khối location nào bên dưới, các add_header cấp server này sẽ bị ghi đè cho location đó.
    # Chống Clickjacking: cấm nhúng trang vào <iframe>.
    add_header X-Frame-Options "DENY" always;
    # Ép trình duyệt tin đúng Content-Type, không tự đoán MIME để tránh thực thi file giả dạng.
    add_header X-Content-Type-Options "nosniff" always;
    # Chỉ gửi domain gốc trong Referer khi chuyển sang trang ngoài, tránh lộ path/query.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tắt quyền camera, micro và vị trí khi chưa sử dụng.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Chính sách CSP chống XSS: chỉ chạy JS nội bộ, cho phép Google Fonts của UI và chặn nhúng frame/object.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Chỉ chuyển tiếp /api và /me sang service backend trong mạng Docker Compose.
    location ~ ^/(api(?:/|$)|me$) {
        proxy_pass http://backend:8080;
        # Dùng HTTP/1.1 để hỗ trợ keep-alive và chuẩn header hiện đại tới Spring Boot.
        proxy_http_version 1.1;
        # Truyền tên miền gốc, IP thật của client và giao thức (http/https) cho backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Fallback về /index.html để React xử lý các route phía client (như /login, /register, /profile) khi tải lại trang.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
