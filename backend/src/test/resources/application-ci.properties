# Chỉ dùng service test độc lập; không fallback sang .env của ứng dụng.
spring.datasource.url=jdbc:postgresql://${TICKETLOCK_TEST_DB_HOST}:${TICKETLOCK_TEST_DB_PORT}/${TICKETLOCK_TEST_DB_NAME}
spring.datasource.username=${TICKETLOCK_TEST_DB_USER}
spring.datasource.password=${TICKETLOCK_TEST_DB_PASSWORD}
spring.data.redis.host=${TICKETLOCK_TEST_REDIS_HOST}
spring.data.redis.port=${TICKETLOCK_TEST_REDIS_PORT}
spring.data.redis.password=${TICKETLOCK_TEST_REDIS_PASSWORD}
spring.session.data.redis.namespace=ticketlock:ci:session
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
