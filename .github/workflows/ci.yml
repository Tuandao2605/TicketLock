name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ticketlock_test
          POSTGRES_USER: ticketlock_test
          POSTGRES_PASSWORD: ticketlock_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketlock_test -d ticketlock_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SPRING_PROFILES_INCLUDE: ci
      TICKETLOCK_TEST_DB_HOST: 127.0.0.1
      TICKETLOCK_TEST_DB_PORT: '5432'
      TICKETLOCK_TEST_DB_NAME: ticketlock_test
      TICKETLOCK_TEST_DB_USER: ticketlock_test
      TICKETLOCK_TEST_DB_PASSWORD: ticketlock_test_password
      TICKETLOCK_TEST_REDIS_HOST: 127.0.0.1
      TICKETLOCK_TEST_REDIS_PORT: '6379'
      TICKETLOCK_TEST_REDIS_PASSWORD: ''
      TICKETLOCK_REDIS_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests and migration checks
        run: ./backend/gradlew -p backend test
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
