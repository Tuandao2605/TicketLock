name: ticketlock-ci-test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketlock_test
      POSTGRES_USER: ticketlock_test
      POSTGRES_PASSWORD: ticketlock_test_password
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketlock_test -d ticketlock_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "ticketlock_test_password"]
    environment:
      REDISCLI_AUTH: ticketlock_test_password
    ports:
      - "127.0.0.1:16380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
