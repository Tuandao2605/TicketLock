# Bật lại auto-configuration bị tắt ở profile mặc định.
spring.autoconfigure.exclude=

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:ticketlock_redis_dev}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# Spring Boot 4 dùng tiền tố spring.session.data.redis.
spring.session.data.redis.repository-type=indexed
spring.session.data.redis.namespace=ticketlock:session
spring.session.timeout=15m
server.servlet.session.cookie.name=JSESSIONID
