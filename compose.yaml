services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Thieu DB_NAME trong .env}
      POSTGRES_USER: ${DB_USERNAME:?Thieu DB_USERNAME trong .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${DB_PORT:?Thieu DB_PORT trong .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
