spring.application.name=ticketlock
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Mặc định học session trong Tomcat; profile redis sẽ bật Spring Session.
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
spring.data.redis.repositories.enabled=false

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Chỉ dùng update cho bài thực hành; dùng migration khi triển khai thực tế.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Thời gian không hoạt động, không phải thời hạn tuyệt đối từ lúc login.
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
