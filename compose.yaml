services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Thieu DB_NAME trong .env}
      POSTGRES_USER: ${DB_USERNAME:?Thieu DB_USERNAME trong .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${DB_PORT:?Thieu DB_PORT trong .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-ticketlock_redis_dev}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ticketlock_redis_dev}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
